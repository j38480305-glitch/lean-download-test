name: Download portable languages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  zig:
    runs-on: ubuntu-latest
    steps:
      - name: Download Zig 0.16.0
        run: |
          curl -L --fail --retry 3 -o zig.tar.xz \
            https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz
          mkdir -p zig-package
          tar -xJf zig.tar.xz -C zig-package --strip-components=1
          ./zig-package/zig version
      - name: Upload Zig
        uses: actions/upload-artifact@v4
        with:
          name: zig-0.16.0-linux-x86_64
          path: zig-package
          retention-days: 3

  julia:
    runs-on: ubuntu-latest
    steps:
      - name: Download Julia 1.12.6
        run: |
          curl -L --fail --retry 3 -o julia.tar.gz \
            https://julialang-s3.julialang.org/bin/linux/x64/1.12/julia-1.12.6-linux-x86_64.tar.gz
          mkdir -p julia-package
          tar -xzf julia.tar.gz -C julia-package --strip-components=1
          ./julia-package/bin/julia --version
      - name: Upload Julia
        uses: actions/upload-artifact@v4
        with:
          name: julia-1.12.6-linux-x86_64
          path: julia-package
          retention-days: 3

  sage:
    runs-on: ubuntu-latest
    steps:
      - name: Download SageMath 10.9 AppImage
        run: |
          curl -L --fail --retry 3 -o SageMath-10.9-x86_64.AppImage \
            https://github.com/3-manifolds/sage_appimage/releases/download/v10.9.1/SageMath-10.9-x86_64.AppImage
          chmod +x SageMath-10.9-x86_64.AppImage
          ls -lh SageMath-10.9-x86_64.AppImage
      - name: Upload SageMath AppImage
        uses: actions/upload-artifact@v4
        with:
          name: sagemath-10.9-appimage
          path: SageMath-10.9-x86_64.AppImage
          retention-days: 3
